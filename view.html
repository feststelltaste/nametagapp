<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NametagApp – live</title>
<style>
  :root { --bg:#f5f5f4; --fg:#1c1917; --muted:#78716c; --line:#d6d3d1; --accent:#c8102e; color-scheme:light; }   /* wie die App im Light Mode */
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:12px; touch-action:manipulation; }
  #tag { display:none; max-width:none; max-height:none; background:#fff; position:relative; }   /* keine runden Ecken; die Zacken links und rechts setzt das Skript per clip-path */
  #shadow { filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)) drop-shadow(0 4px 14px rgba(0,0,0,.08)); }   /* Schatten außen, damit er die Zacken nachzeichnet */
  #shadow { position:relative; flex:none; }
  /* Trägerpapier: schmale hellbeige Streifen nur über und unter dem Etikett; links und rechts (in den Zacken) ist kein Rand zu sehen */
  #shadow::before { content:""; position:absolute; left:2.5px; right:2.5px; top:-9px; bottom:-9px; background:#f0e6d0; border-block:1px solid #e2d5b8; }
  #consent { position:fixed; inset:0; z-index:6; display:flex; justify-content:center; padding:max(32px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); background:var(--bg); overflow:auto; }   /* oben und unten Luft; die Karte zentriert sich mit margin:auto und läuft bei viel Text nicht oben aus dem Bild */
  #consent[hidden] { display:none; }
  #consent .card { width:min(520px, 100%); margin:auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:22px 20px; box-shadow:0 4px 24px rgba(0,0,0,.08); }
  .langs { display:flex; gap:6px; justify-content:flex-end; margin:0 0 14px; }
  .langs button { font:inherit; font-size:.85rem; font-weight:600; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--muted); cursor:pointer; }
  .langs button[aria-pressed="true"] { border-color:var(--accent); color:var(--fg); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  #consent h2 { margin:0 0 8px; font-size:1.25rem; }
  #consent p { margin:8px 0; }
  #consent ul { margin:8px 0 8px 1.1em; padding:0; }
  #consent li { margin:6px 0; }
  #consent .small { font-size:.85rem; color:var(--muted); }
  #consent a { color:inherit; }
  .consentbtns { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
  .consentbtns button { font:inherit; font-weight:600; padding:12px 18px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; }
  .consentbtns #consentYes { background:var(--accent); border-color:var(--accent); color:#fff; }
  #welcome { position:fixed; top:0; left:0; right:0; z-index:2; padding:16px 16px 4px; text-align:center; pointer-events:none; }
  #welcome[hidden] { display:none; }
  #welcomeTitle { font-size:clamp(1.6rem, 4.2vw, 3.2rem); font-weight:800; line-height:1.15; }
  #welcomeSub { margin-top:4px; font-size:clamp(1rem, 2.2vw, 1.7rem); color:var(--muted); }
  #scan { position:fixed; right:16px; bottom:16px; z-index:3; width:min(340px, 46vw); padding:12px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.15); }
  #scan[hidden] { display:none; }
  #scanQr svg { display:block; width:100%; height:auto; }
  #scanText { margin-top:8px; font-size:.95rem; line-height:1.25; color:var(--muted); }
  @keyframes bubblePop { from { scale:.8; opacity:0; } to { scale:1; opacity:1; } }
  .bubble { position:fixed; z-index:4; padding:32px 36px; text-align:center; color:#1c1917; font-size:clamp(1.2rem, 2.4vw, 2.1rem); font-weight:700; line-height:1.25; pointer-events:none; animation:bubblePop .25s ease-out; }
  .bubble svg { position:absolute; left:0; top:0; overflow:visible; animation:bubbleGlow 1.8s ease-in-out infinite; }   /* Ellipse samt Spitze als ein SVG-Pfad; leuchtet in der Hauptfarbe */
  .bubble path { fill:#fff; stroke:var(--accent); stroke-width:4; stroke-linejoin:round; }
  .bubble span { position:relative; white-space:pre-line; }   /* \n im Text = Zeilenumbruch */
  @keyframes bubbleGlow { 0%, 100% { filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent)); } 50% { filter:drop-shadow(0 0 20px color-mix(in srgb, var(--accent) 95%, transparent)); } }
  @media (prefers-reduced-motion: reduce) { .bubble, .bubble svg { animation:none; } .bubble svg { filter:drop-shadow(0 0 12px color-mix(in srgb, var(--accent) 70%, transparent)); } }
  .bubble[hidden] { display:none; }
  #ideas { position:fixed; z-index:3; display:flex; flex-wrap:wrap; gap:0 .5em; justify-content:center; align-content:flex-start; color:#b5afa9; font-family:ui-monospace, Menlo, Consolas, monospace; pointer-events:none; transition:opacity .7s ease; }   /* liegt auf dem Etikett genau dort, wo die echten Hashtags erscheinen */
  #ideas span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #ideas.above { font-weight:600; font-size:clamp(1.1rem, 2vw, 1.6rem); line-height:1.3; transform:translateY(-100%); }   /* Adjektive: über der Blase */
  #ideas[hidden] { display:none; }
  #fs { position:fixed; left:max(12px, env(safe-area-inset-left)); bottom:max(12px, env(safe-area-inset-bottom)); z-index:3; width:44px; height:44px; padding:0; display:flex; align-items:center; justify-content:center; color:var(--fg); background:#fff; border:1px solid var(--line); border-radius:10px; cursor:pointer; opacity:.45; transition:opacity .15s; -webkit-tap-highlight-color:transparent; }
  #fs:hover, #fs:focus-visible, #fs[aria-pressed="true"] { opacity:1; }
  #fs[hidden] { display:none; }
  #okbar { position:fixed; left:0; right:0; bottom:max(16px, env(safe-area-inset-bottom)); z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 16px; pointer-events:none; }
  #okbar[hidden] { display:none; }
  #ok { pointer-events:auto; font:inherit; font-size:1.2rem; font-weight:700; padding:14px 40px; border-radius:999px; border:3px solid var(--accent); background:#fff; color:var(--accent); box-shadow:0 6px 24px rgba(0,0,0,.2); cursor:pointer; }
  #okNote { max-width:min(420px, 100%); padding:10px 14px; border-radius:12px; background:#fff; border:1px solid var(--line); color:var(--muted); font-size:.9rem; text-align:center; }
  #lostNote { display:none; position:fixed; left:0; right:0; bottom:8px; text-align:center; font-size:.8rem; color:var(--muted); z-index:2; }
  body.lost #lostNote { display:block; }
  #wait { text-align:center; color:var(--muted); padding:24px; }
  #wait b { display:block; color:var(--fg); font-size:1.3rem; margin-bottom:6px; }
</style>
</head>
<body>
<div id="consent" hidden>
  <div class="card">
    <div class="langs" role="group" aria-label="Sprache / Language"><button type="button" data-lang="de">Deutsch</button><button type="button" data-lang="en">English</button></div>
    <h2 id="consentTitle"></h2>
    <p id="consentIntro"></p>
    <ul id="consentList"></ul>
    <p id="consentHost" class="small" hidden></p>
    <p class="small"><a id="consentMore" target="_blank" rel="noopener"></a> · <a id="consentNtfy" target="_blank" rel="noopener"></a></p>
    <div class="consentbtns">
      <button type="button" id="consentNo"></button>
      <button type="button" id="consentYes"></button>
    </div>
    <p id="consentDone" class="small" hidden></p>
  </div>
</div>
<div id="bubble" class="bubble" role="status" hidden></div>
<div id="ideas" aria-hidden="true" hidden></div>
<div id="okbar" hidden><button type="button" id="ok"></button><div id="okNote" hidden></div></div>
<div id="lostNote"></div>
<aside id="scan" hidden>
  <div id="scanQr" aria-hidden="true"></div>
  <div id="scanText"></div>
</aside>
<header id="welcome" hidden>
  <div id="welcomeTitle"></div>
  <div id="welcomeSub"></div>
</header>
<button type="button" id="fs" hidden aria-pressed="false" aria-label="Vollbild / Full screen" title="Vollbild / Full screen"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
<div id="stage">
  <div id="shadow"><img id="tag" alt="Namensschild"></div>
  <div id="wait"><b>No name tag yet</b>Open the editor in the same browser (same address). As soon as a label appears there, you will see it here live.</div>
</div>

<script src="vendor/qrcode.js"></script>
<script src="label.js"></script>
<script src="relay.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
const tag = $("tag");


function fit() {
  const header = $("welcome").hidden ? 0 : $("welcome").offsetHeight;   // Platz für den Willkommenstext oben
  $("stage").style.paddingTop = (12 + header) + "px";
  if (!tag.naturalWidth) return;
  const bubbleRoom = roomMode || !bubblesOn ? 0 : bubbleWidth() + 30;   // links Platz für die Sprechblase: sie darf das Etikett nie überdecken
  let boxW = innerWidth - 24, boxH = innerHeight - 24 - 20 - header;   // 20 px für die Trägerpapier-Streifen oben und unten
  let scale = Math.min(boxW / tag.naturalWidth, boxH / tag.naturalHeight);   // das Etikett bleibt immer liegend und wird nur skaliert
  const labelW = Math.floor(tag.naturalWidth * scale), free = (innerWidth - labelW) / 2;
  if (free < bubbleRoom) {   // links ist zu wenig frei (kleiner Bildschirm): Etikett schmaler und nach rechts neben den Blasenplatz
    boxW = innerWidth - 24 - bubbleRoom;
    scale = Math.min(boxW / tag.naturalWidth, boxH / tag.naturalHeight);
  }
  const shift = free < bubbleRoom ? bubbleRoom : 0;
  $("stage").style.paddingLeft = 12 + shift + "px";
  $("welcome").style.paddingLeft = 16 + shift + "px";   // die Überschrift bleibt über dem Etikett zentriert
  tag.style.width = Math.floor(tag.naturalWidth * scale) + "px";
  tag.style.height = Math.floor(tag.naturalHeight * scale) + "px";
  tag.style.clipPath = sawEdges(Math.floor(tag.naturalWidth * scale), Math.floor(tag.naturalHeight * scale));
}

// Willkommenstext (vom Editor, unter Einstellungen): große Zeile und darunter eine kleinere
function showWelcome(welcome) {
  const title = (welcome?.title || "").trim(), sub = (welcome?.sub || "").trim();
  $("welcomeTitle").textContent = title; $("welcomeSub").textContent = sub;
  $("welcomeTitle").hidden = !title; $("welcomeSub").hidden = !sub;
  $("welcome").hidden = !title && !sub;
  fit();
}

// Winzige Zacken am linken und rechten Rand, wie bei einem abgerissenen Etikett (clip-path in Bildpixeln)
function sawEdges(w, h) {
  const tooth = 5, depth = 2.5;                        // Höhe eines Zahns, Tiefe der Zacke
  const n = Math.max(2, Math.round(h / tooth)), step = h / n;
  const pts = [`${depth}px 0`, `${w - depth}px 0`];
  for (let i = 0; i < n; i++) pts.push(`${w}px ${(i + 0.5) * step}px`, `${w - depth}px ${(i + 1) * step}px`);   // rechts nach unten
  pts.push(`${depth}px ${h}px`);
  for (let i = n - 1; i >= 0; i--) pts.push(`0px ${(i + 0.5) * step}px`, `${depth}px ${i * step}px`);          // links nach oben
  return `polygon(${pts.join(",")})`;
}

function show(label) {
  if (!label?.image) { tag.style.display = "none"; $("wait").style.display = ""; return; }
  tag.onload = () => { fit(); tag.style.display = "block"; $("wait").style.display = "none"; placeBubble(); };
  tag.src = label.image;
}

// QR-Code für den Teilnehmer: öffnet auf dessen Handy diese Seite und koppelt es mit dem Editor
function showScan(link) {
  $("scan").hidden = !link;
  $("scan").dataset.link = link || "";
  $("scanQr").innerHTML = "";
  if (!link) return;
  try { $("scanQr").innerHTML = Relay.qrSvg(link); } catch { $("scan").hidden = true; }
  $("scanText").textContent = L("scan");
}

// Der Editor (index.html) schickt jedes neue Etikett per BroadcastChannel an dieses Fenster. Beide Seiten
// müssen vom selben Ursprung kommen (z. B. beide über http://localhost:8000) und im selben Browser laufen.
const LIVE_KEY = "meetupapp.live";   // letztes Etikett, damit die Ansicht auch ohne offenen Editor etwas zeigt
const roomMode = /^#r=/.test(location.hash);   // Raum-Link: das Etikett kommt über den Relay, nicht aus diesem Browser
let channel = null, regions = null, regionsExtra = {}, focusField = "", tagName = "", gender = null, bubbleText = "", bubblesOn = true, adjectiveIdeas = null;
if (!roomMode) try {
  channel = new BroadcastChannel("meetup-label");
  channel.onmessage = event => {
    const message = event.data;
    if (message?.type === "label") { show({ image: message.image }); showWelcome(message.welcome); regions = message.regions || null; regionsExtra = message.regions || {}; tagName = message.name || ""; bubblesOn = message.bubbles !== false; fit(); placeBubble(); }
    else if (message?.type === "focus") { bubblesOn = message.enabled !== false; fit(); focusField = message.field || ""; gender = message.gender || null; bubbleText = message.text || ""; adjectiveIdeas = message.ideas || null; placeBubble(); }
    else if (message?.type === "pair") showScan(message.link);        // Kopplungscode des Editors: der Teilnehmer scannt ihn
    else if (message?.type === "pair-clear") showScan("");
  };
  channel.postMessage({ type: "hello" });   // Editor antwortet mit dem aktuellen Etikett
} catch { $("wait").textContent = "BroadcastChannel wird von diesem Browser nicht unterstützt."; }
if (!roomMode) {
  try { const last = localStorage.getItem(LIVE_KEY); if (last) show({ image: last }); } catch {}
  try { showWelcome(JSON.parse(localStorage.getItem("meetupapp.welcome") || "null")); } catch {}
}

addEventListener("resize", () => { fit(); placeBubble(); });
// Vollbild (Handy und Desktop), nur wenn der Browser es kann; auf dem iPhone hilft „Zum Home-Bildschirm“
if (document.fullscreenEnabled) {
  $("fs").hidden = false;
  $("fs").addEventListener("click", () => { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({ navigationUI: "hide" })).catch(() => {}); });
  document.addEventListener("fullscreenchange", () => $("fs").setAttribute("aria-pressed", String(Boolean(document.fullscreenElement))));
}
// Sprechblase links neben dem Etikett: sie zeigt auf die Stelle, an der das Feld, in dem der Cursor gerade steht, auf dem Etikett erscheint
// Hashtag-Inspiration: solange das Hashtag-Feld aktiv ist, blenden ein paar graue Begriffe über der Blase auf und ab
const IDEAS = ["#softwarearchitektur", "#clean-architecture", "#microservices", "#domain-driven-design", "#event-sourcing", "#cqrs", "#hexagonal", "#docs-as-code", "#arc42", "#adr",
  "#api-design", "#rest", "#graphql", "#kubernetes", "#devops", "#ci-cd", "#testing", "#tdd", "#refactoring", "#clean-code",
  "#java", "#kotlin", "#typescript", "#rust", "#python", "#observability", "#security", "#modularität", "#legacy", "#ai-assisted-coding"];
const HOBBIES = {   // Hobbys zum Warmwerden: die Hashtags beginnen damit und mischen sich dann unter die Technik-Begriffe
  de: ["#schwimmen", "#reiten", "#lesen", "#joggen", "#wandern", "#kochen", "#fotografie", "#radfahren", "#musik", "#klettern", "#gärtnern"],
  en: ["#swimming", "#riding", "#reading", "#running", "#hiking", "#cooking", "#photography", "#cycling", "#music", "#climbing", "#gardening"] };
let ideasTimers = new Set(), ideasKey = "", ideasRunning = false;
function showIdeas(on, list = IDEAS, first = null) {
  const box = $("ideas");
  if (!on) { for (const t of ideasTimers) clearTimeout(t); ideasTimers.clear(); ideasRunning = false; box.hidden = true; return; }
  const key = list.join("|");
  if (ideasRunning && key === ideasKey) return;   // läuft schon mit derselben Liste
  for (const t of ideasTimers) clearTimeout(t);
  ideasTimers.clear(); ideasKey = key; ideasRunning = true;
  const later = (fn, ms) => { const t = setTimeout(() => { ideasTimers.delete(t); fn(); }, ms); ideasTimers.add(t); };
  // Drei Plätze, jeder blendet für sich und zu eigenen Zeiten ein und aus
  const slots = [0, 1, 2].map(() => Object.assign(document.createElement("span"), { textContent: "" }));
  box.replaceChildren(...slots); box.hidden = false;
  const pickNew = () => { const taken = slots.map(el => el.textContent); const free = list.filter(w => !taken.includes(w)); return free[Math.floor(Math.random() * free.length)]; };
  slots.forEach((el, i) => {
    el.style.transition = "opacity .7s ease"; el.style.opacity = 0;
    if (first?.[i]) el.textContent = first[i];   // der erste Durchgang beginnt mit den Hobbys
    const cycle = () => later(() => { el.style.opacity = 0; later(() => { el.textContent = pickNew(); el.style.opacity = 1; cycle(); }, 800); }, 2200 + Math.random() * 3200);
    later(() => { if (!el.textContent) el.textContent = pickNew(); el.style.opacity = 1; cycle(); }, 300 + i * 650);
  });
}
const bubbleWidth = () => Math.round(Math.min(400, innerWidth * 0.34));
function placeBubble() {
  const bubble = $("bubble"), range = regions?.[focusField];
  try { const accent = localStorage.getItem("meetupapp.accent"); if (accent) document.documentElement.style.setProperty("--accent", accent); } catch {}   // Hauptfarbe aus den Einstellungen des Editors
  if (!focusField || !range || !tag.naturalWidth || tag.style.display === "none") { bubble.hidden = true; showIdeas(false); return; }
  const rect = tag.getBoundingClientRect();
  const template = bubbleText || L("bubble_" + focusField + (focusField === "greeting" && !tagName ? "_noname" : ""));   // bubbleText: eigener Text aus den Einstellungen des Editors
  const y = rect.top + rect.height * (range[0] + range[1]) / 2;   // Mitte des Bereichs auf dem Etikett
  const text = document.createElement("span");
  text.textContent = template.replace("{name}", tagName || (uiLang === "de" ? "Name" : "name")).replace("{welcher}", gender === "m" ? "Welcher" : gender === "f" ? "Welche" : "Welche(r)");   // {name}: der Name, wie er auf dem Etikett steht
  bubble.replaceChildren(text);
  bubble.style.maxWidth = bubbleWidth() + "px";
  bubble.hidden = false;
  // Ellipse mit Spitze unten rechts als ein Pfad: die Spitze wächst aus dem Rand heraus und zeigt auf die Stelle am Etikett
  const w = bubble.offsetWidth, h = bubble.offsetHeight, rx = w / 2 - 2, ry = h / 2 - 2, cx = w / 2, cy = h / 2;
  const at = deg => [cx + rx * Math.cos(deg * Math.PI / 180), cy + ry * Math.sin(deg * Math.PI / 180)];
  const [x1, y1] = at(36), [x2, y2] = at(52), [mx, my] = at(44), lift = !bubbleText && focusField === "greeting" && !tagName ? 110 : 0, tip = [mx + 40, my + 40 + lift];   // "Wie bist du so?" sitzt deutlich höher, die Spitze wird länger und zeigt weiter auf die Stelle
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg"), path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  svg.setAttribute("width", w); svg.setAttribute("height", h); svg.setAttribute("aria-hidden", "true");
  path.setAttribute("d", `M${x2} ${y2} A${rx} ${ry} 0 1 1 ${x1} ${y1} L${tip[0]} ${tip[1]} Z`);
  svg.append(path); bubble.prepend(svg);
  bubble.style.left = Math.max(8, rect.left - 6 - tip[0]) + "px";   // die Spitze berührt knapp den linken Etikettrand
  bubble.style.top = Math.max(8, y - tip[1]) + "px";
  const ideas = $("ideas"), bubbleTop = parseFloat(bubble.style.top), onLabel = focusField === "tags", tagsUsed = onLabel && range[1] - range[0] > 0.005;   // tagsUsed: es stehen schon Hashtags auf dem Etikett
  const hobbies = HOBBIES[uiLang] || HOBBIES.en;
  const list = focusField === "tags" ? IDEAS.concat(hobbies) : focusField === "greeting" ? adjectiveIdeas : null;
  showIdeas(Boolean(list?.length) && !tagsUsed && (onLabel || bubbleTop > 60), list || IDEAS, focusField === "tags" ? hobbies.slice(0, 3) : null);   // Inspiration bei Hashtags und Adjektiven, wenn über der Blase Platz ist
  ideas.classList.toggle("above", !onLabel);
  if (onLabel) {   // Hashtags: auf dem Etikett an der Stelle der echten Hashtags, in Größe und Zeilenhöhe der echten
    const used = false, size = rect.height * (regionsExtra.tagFont || 0.078);
    ideas.style.left = rect.left + "px"; ideas.style.width = rect.width + "px";
    ideas.style.top = rect.top + rect.height * (used ? range[1] : range[0]) + "px";
    ideas.style.fontSize = size + "px"; ideas.style.lineHeight = rect.height * (regionsExtra.tagRow || 0.09) + "px";
  } else {
    ideas.style.fontSize = ideas.style.lineHeight = "";
    ideas.style.left = parseFloat(bubble.style.left) + "px"; ideas.style.width = w + "px"; ideas.style.top = bubbleTop - 10 + "px";
  }   // ... die Spitze reicht schräg nach unten auf die Stelle; die Blase sitzt dadurch etwas darüber
}
fit();
// ---------- Raum auf einem anderen Gerät (view.html#r=<Raum>): der Editor schickt verschlüsselt jede Änderung, wir zeichnen sie selbst ----------
const GITHUB_PRIVACY = "https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement";
const README_PRIVACY = "https://github.com/feststelltaste/nametagapp#privacy", NTFY_PRIVACY = "https://docs.ntfy.sh/privacy/";
const TEXT = {
  de: { scan: "Scanne den Code, um dein Namensschild auf dein Handy zu übertragen. Nach dem Scannen musst du erst zustimmen; ohne deine Zustimmung werden keine Daten übertragen.", waitingTitle: "Noch kein Namensschild", waiting: "Sobald im Editor ein Etikett erscheint, siehst du es hier live.",
        bubble_name: "Verrate uns deinen Namen", bubble_greeting: "{welcher} {name}\nbist du?", bubble_greeting_noname: "Wie\nbist du so?", bubble_tags: "Was begeistert dich?",
        okButton: "Passt ✓", okDone: "Danke! Die Verbindung ist beendet, dein Namensschild bleibt hier sichtbar. Du kannst diese Seite schließen.",
        reconnecting: "Verbindung unterbrochen, versuche es erneut …", bad: "Dieser Link ist ungültig. Scanne den QR-Code im Editor noch einmal.",
        consentTitle: "Namensschild auf dein Handy übertragen?",
        consentIntro: "Du hast den Code gescannt. Wenn du zustimmst, werden die Daten deines Namensschilds (Name, Titel, Hashtags) über den öffentlichen Dienst ntfy.sh (ein Drittanbieter) auf dieses Handy übertragen. Erst wenn du unten zustimmst, passiert Folgendes:",
        consentItems: ["ntfy.sh sieht deine IP-Adresse, deinen Browser-Typ und die Adresse dieser Seite.",
                       "Die Daten deines Namensschilds (Name, Titel, Hashtags) werden vom Editor an dieses Handy übertragen, Ende-zu-Ende verschlüsselt über ntfy.sh. Der Dienst kann sie nicht lesen, speichert sie aber bis zu 12 Stunden.",
                       "Dein Handy sendet nur ein kurzes verschlüsseltes „Hallo“, damit das Namensschild geschickt wird. Keine Cookies, kein Konto.",
                       "Ohne deine Zustimmung werden deine Namensschild-Daten nicht übertragen, und es wird nichts an ntfy.sh gesendet."],
        consentYes: "Zustimmen und Namensschild übertragen", consentNo: "Nicht zustimmen", consentDone: "Du hast nicht zugestimmt, es wurden keine Daten übertragen. Du kannst diese Seite schließen.",
        consentHost: "Hinweis: Beim Öffnen dieser Seite hat deren Hoster GitHub Pages bereits deine IP-Adresse und deinen Browser-Typ gesehen. Das hat mit deiner Entscheidung hier nichts zu tun und lässt sich nicht vermeiden.", consentGithub: "Datenschutzerklärung von GitHub",
        consentMore: "Details zum Datenschutz", consentNtfy: "Datenschutzerklärung von ntfy" },
  en: { scan: "Scan to transfer your name tag to your phone. After scanning you must agree first; without your consent no data is transferred.", waitingTitle: "No name tag yet", waiting: "As soon as a label appears in the editor, you will see it here live.",
        bubble_name: "Tell us your name", bubble_greeting: "Which {name} are you?", bubble_greeting_noname: "What are you like?", bubble_tags: "What excites you?",
        okButton: "Looks good ✓", okDone: "Thanks! The connection is closed, your name tag stays visible here. You can close this page.",
        reconnecting: "Connection lost, trying again …", bad: "This link is not valid. Scan the QR code in the editor again.",
        consentTitle: "Transfer your name tag to your phone?",
        consentIntro: "You have scanned the code. If you agree, the data of your name tag (name, title, hashtags) is transferred to this phone through the public service ntfy.sh (a third party). Only when you agree below, this happens:",
        consentItems: ["ntfy.sh sees your IP address, your browser type and the address of this page.",
                       "The data of your name tag (name, title, hashtags) is transferred from the editor to this phone, end-to-end encrypted through ntfy.sh. The service cannot read it, but keeps it for up to 12 hours.",
                       "Your phone only sends a short encrypted “hello” so that the name tag is sent. No cookies, no account.",
                       "Without your consent your name tag data is not transferred and nothing is sent to ntfy.sh."],
        consentYes: "Agree and transfer my name tag", consentNo: "Do not agree", consentDone: "You did not agree, so no data was transferred. You can close this page.",
        consentHost: "Note: When this page was opened, its host GitHub Pages already saw your IP address and browser type. That has nothing to do with your choice here and cannot be avoided.", consentGithub: "GitHub privacy statement",
        consentMore: "Privacy details", consentNtfy: "ntfy privacy policy" },
};
const phoneLang = (navigator.languages?.length ? navigator.languages : [navigator.language || "en"]).map(l => l.toLowerCase().slice(0, 2)).find(l => l === "de" || l === "en") || "en";   // die erste unterstützte Sprache des Handys
let uiLang = phoneLang;   // Gäste lesen die Zustimmung in der Sprache ihres Handys; eine im Editor gewählte Sprache hat Vorrang
try { const saved = localStorage.getItem("meetupapp.lang"); if (saved === "de" || saved === "en") uiLang = saved; } catch {}
const L = key => TEXT[uiLang][key];

// Zeichnet das Etikett aus dem Modell des Editors (label.js, dieselbe Berechnung wie im Editor)
function applyPayload(payload) {
  if (!payload?.model) return;
  const plan = Label.plan(payload.model);
  show({ image: Label.previewCanvas(plan, payload.model.zoom || 1).toDataURL("image/png") });
  showWelcome(payload.welcome);
  offerOk(Boolean((payload.model.name || "").trim()));
}
let roomSubscription = null, okTimer = null, currentRoom = null;
// „Passt“ quittiert das Etikett: das Abo bei ntfy.sh wird geschlossen (gibt den Platz für andere Gäste im selben WLAN frei), das Etikett bleibt sichtbar.
// Ohne Tippen wird nach 15 Minuten ohne neue Nachricht genauso beendet.
function offerOk(show) {
  clearTimeout(okTimer);
  $("ok").textContent = L("okButton"); $("ok").hidden = false;
  $("okbar").hidden = !show; $("okNote").hidden = true;
  if (show) okTimer = setTimeout(() => finishRoom(), 15 * 60 * 1000);
}
function finishRoom(confirmed = false) {
  clearTimeout(okTimer);
  if (confirmed && currentRoom) Relay.ack(currentRoom).catch(() => {});   // dem Editor melden: „Passt“
  roomSubscription?.close(); roomSubscription = null;
  document.body.classList.remove("lost"); $("lostNote").textContent = "";
  $("ok").hidden = true; $("okNote").textContent = L("okDone"); $("okNote").hidden = false; $("okbar").hidden = false;
}
$("ok").addEventListener("click", () => finishRoom(true));
function connectRoom(room) {
  const wait = $("wait");
  wait.innerHTML = ""; const bold = document.createElement("b"); bold.textContent = L("waitingTitle"); wait.append(bold, L("waiting"));
  currentRoom = room;
  roomSubscription = Relay.subscribe(room, applyPayload, state => {
    if (state === "verbunden") Relay.signal(room).catch(() => {});   // dem Editor melden: ab jetzt senden (auch nach einer Wiederverbindung)
    document.body.classList.toggle("lost", state === "getrennt");
    $("lostNote").textContent = state === "getrennt" ? L("reconnecting") : "";
  });
}
// Zustimmung vor der ersten Verbindung: der Gast erfährt, was an ntfy.sh geht, bevor irgendetwas gesendet wird
// Zustimmungstexte in der gewählten Sprache setzen; die Knöpfe „Deutsch / English“ stellen die Sprache des Handys vor und lassen sie ändern
let consentRefused = false;
function renderConsent() {
  document.documentElement.lang = uiLang;
  for (const button of document.querySelectorAll(".langs button")) button.setAttribute("aria-pressed", String(button.dataset.lang === uiLang));
  $("consentTitle").textContent = L("consentTitle"); $("consentIntro").textContent = L("consentIntro");
  $("consentList").replaceChildren(...L("consentItems").map(text => Object.assign(document.createElement("li"), { textContent: text })));
  $("consentYes").textContent = L("consentYes"); $("consentNo").textContent = L("consentNo");
  $("consentMore").textContent = L("consentMore"); $("consentMore").href = README_PRIVACY;
  $("consentNtfy").textContent = L("consentNtfy"); $("consentNtfy").href = NTFY_PRIVACY;
  const host = $("consentHost"); host.hidden = !/\.github\.io$/i.test(location.hostname);   // nur wenn die Seite wirklich bei GitHub Pages liegt
  if (!host.hidden) { const link = Object.assign(document.createElement("a"), { textContent: L("consentGithub"), href: GITHUB_PRIVACY, target: "_blank", rel: "noopener" }); host.replaceChildren(L("consentHost") + " ", link); }
  $("consentDone").textContent = L("consentDone"); $("consentDone").hidden = !consentRefused;
}
for (const button of document.querySelectorAll(".langs button")) button.addEventListener("click", () => { uiLang = button.dataset.lang; renderConsent(); });
function askConsent(room) {
  consentRefused = false; renderConsent(); $("consent").hidden = false;
  $("consentYes").hidden = $("consentNo").hidden = false;
  $("consentYes").onclick = () => { try { sessionStorage.setItem("consent:" + room.topic, "1"); } catch {} $("consent").hidden = true; connectRoom(room); };
  $("consentNo").onclick = () => { consentRefused = true; renderConsent(); $("consentYes").hidden = $("consentNo").hidden = true; };
}
function openRoom() {
  roomSubscription?.close(); roomSubscription = null;
  const match = location.hash.match(/^#r=(.+)$/);
  if (!match) return;
  const room = Relay.parseRoom(match[1]);
  if (!room) { $("wait").textContent = L("bad"); return; }
  let agreed = false;
  try { agreed = sessionStorage.getItem("consent:" + room.topic) === "1"; } catch {}   // in diesem Tab schon zugestimmt: nicht nochmal fragen
  if (agreed) connectRoom(room); else askConsent(room);
}
openRoom();
addEventListener("hashchange", openRoom);   // ein neuer Link im selben Tab ändert nur den Teil nach dem #

// Bildschirm anlassen, solange die Seite offen ist
let wake = null;
async function keepAwake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
keepAwake();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
</script>
